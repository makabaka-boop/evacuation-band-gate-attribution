services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evac}
      POSTGRES_DB: ${POSTGRES_DB:-evac}
    ports:
      # 便于本机调试；宿主侧端口可覆盖。
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evac} -d ${POSTGRES_DB:-evac}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 显式指定的目标连接地址优先于内置组装；未提供时为空串，
      # 由 app.config 回退到 POSTGRES_* 组装（凭据经 URL 编码）。
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-evac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evac}
      POSTGRES_DB: ${POSTGRES_DB:-evac}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # 连接池容量透传入容器；未指定时用与服务默认一致的 5/5。
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    ports:
      # 宿主端口可用 API_PORT 覆盖，例如 API_PORT=9000 docker compose up。
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 一次性验收服务：对真实 PostgreSQL 跑并发事务验收，退出码即结论。
  # 运行： docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build: .
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      # 与 api 同一条配置路径：显式 DATABASE_URL 优先，否则由 app.config
      # 用 POSTGRES_* 组装（凭据经 URL 编码，特殊字符不拆分连接地址）。
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-evac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evac}
      POSTGRES_DB: ${POSTGRES_DB:-evac}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_BASE_URL: http://api:8000
    command: >
      sh -c "python -m pytest tests -v --tb=short -p no:cacheprovider"

volumes:
  pgdata:
